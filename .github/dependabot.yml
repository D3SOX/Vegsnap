version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /scripts/screenshots
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    groups:
      android:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Concurrent-execution regression: https://github.com/google/ksp/issues/3286
      - dependency-name: com.google.devtools.ksp
        versions: ['2.3.13']
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      javascript:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /companion
    schedule:
      interval: weekly
      day: monday
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
