name: Checks
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run strings:check
      - run: bun run typecheck
      - name: Lint TypeScript with Biome
        run: bun run lint
      - name: Lint Python with ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: pyproject.toml
      - run: bun run test
      - run: bun run test:package
      - run: bun run test:screenshots
      - run: python3 -m unittest discover -s scripts -p 'test_extension_stores.py' -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: ./gradlew testDebugUnitTest lintDebug
        working-directory: android
      - name: Lint Kotlin with detekt
        run: ./gradlew detekt
        working-directory: android

  companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - run: cargo +1.98.1 fmt --manifest-path companion/Cargo.toml --check
      - run: cargo +1.98.1 test --locked --manifest-path companion/Cargo.toml
      - run: cargo +1.98.1 clippy --locked --manifest-path companion/Cargo.toml --all-targets -- -D warnings

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint Swift with SwiftLint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.65.1 --repo realm/SwiftLint --pattern portable_swiftlint.zip --dir "$RUNNER_TEMP/swiftlint"
          unzip -q "$RUNNER_TEMP/swiftlint/portable_swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict
      - run: bun run check:ios-types
      - run: bun run test:ios-bridge
      - run: bun run ios:prepare
      - name: Verify the generated project
        run: |
          python3 ios/generate-project.py
          git diff --exit-code -- ios/Vegsnap.xcodeproj
      - name: Test in an available iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for runtime,devices in d["devices"].items() if "iOS-" in runtime and int(runtime.split("iOS-")[1].split("-")[0]) >= 18 for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild -project ios/Vegsnap.xcodeproj -scheme Vegsnap -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- test
