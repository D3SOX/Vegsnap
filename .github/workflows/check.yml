name: Checks
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:package
      - run: bun run test:screenshots
      - run: python3 -m unittest discover -s scripts -p 'test_extension_stores.py' -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: ./gradlew testDebugUnitTest lintDebug
        working-directory: android

  companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - run: cargo +1.98.1 fmt --manifest-path companion/Cargo.toml --check
      - run: cargo +1.98.1 test --locked --manifest-path companion/Cargo.toml
      - run: cargo +1.98.1 clippy --locked --manifest-path companion/Cargo.toml --all-targets -- -D warnings
