name: Publish regional packs
on:
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday 04:17 UTC
  push:
    branches: [main]
    paths:
      - 'scripts/offline-snapshot.ts'
      - 'scripts/regional-catalog.ts'
      - 'packages/core/src/offline.ts'
      - '.github/workflows/regional-packs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-packs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test scripts
      - name: Generate packs and catalog
        run: |
          mkdir pack-release
          for region in germany sweden eu; do
            bun scripts/offline-snapshot.ts --region "$region" --output "pack-release/$region.json" --strict
          done
          bun scripts/regional-catalog.ts "https://github.com/$GITHUB_REPOSITORY/releases/download/offline-data/" pack-release
      - name: Update regional pack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view offline-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create offline-data --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Regional product packs" --notes "Weekly regional product snapshots for offline checks and Browse. Records are partial and community-maintained. Each pack includes its generation date and attribution. The catalog includes download sizes and hashes verified by Vegsnap. See the repository README for data licenses." --latest=false
          fi
          # Packs are immutable assets named after their generation time; the catalog switches to them only once they exist.
          gh release upload offline-data pack-release/{germany,sweden,eu}-*.json --repo "$GITHUB_REPOSITORY"
          gh release upload offline-data pack-release/catalog-v2.json --repo "$GITHUB_REPOSITORY" --clobber
          # Pack generations the catalog no longer references stay for four weekly cycles so catalogs cached by the apps keep downloading. catalog.json and its unversioned packs stay frozen for clients released before 20 MB packs.
          referenced=$(jq -r '.packs[].url | sub(".*/"; "")' pack-release/catalog-v2.json)
          cutoff=$(date -u -d '28 days ago' +%Y%m%d%H%M%S)
          for asset in $(gh release view offline-data --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            case "$asset" in
              germany-*.json|sweden-*.json|eu-*.json)
                generation=${asset##*-}; generation=${generation%.json}
                grep -qxF "$asset" <<<"$referenced" || [ "$generation" -ge "$cutoff" ] || gh release delete-asset offline-data "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done
