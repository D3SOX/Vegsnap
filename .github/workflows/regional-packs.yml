name: Publish regional packs
on:
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday 04:17 UTC
  push:
    branches: [main]
    paths:
      - 'scripts/offline-snapshot.ts'
      - 'scripts/regional-catalog.ts'
      - 'packages/core/src/offline.ts'
      - '.github/workflows/regional-packs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-packs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test scripts
      - name: Generate packs and catalog
        run: |
          # GitHub caps a release at 1,000 assets, so each quarter's packs get their own release; the catalog keeps its fixed URL.
          release="offline-data-$(date -u +%Y)-q$(( ($(date -u +%-m) + 2) / 3 ))"
          echo "PACK_RELEASE=$release" >> "$GITHUB_ENV"
          mkdir pack-release
          bun scripts/offline-snapshot.ts --region all --output-dir pack-release --strict
          bun scripts/regional-catalog.ts "https://github.com/$GITHUB_REPOSITORY/releases/download/$release/" pack-release
      - name: Update regional pack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Weekly regional product snapshots for offline checks and Browse. Records are partial and community-maintained. Each pack includes its generation date and attribution. The catalog includes download sizes and hashes verified by Vegsnap. See the repository README for data licenses."
          for release in offline-data "$PACK_RELEASE"; do
            if ! gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$release" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Regional product packs" --notes "$notes" --latest=false
            fi
          done
          # Packs are immutable assets named after their generation time; the catalog switches to them only once they exist.
          find pack-release -name '*.json' ! -name catalog-v2.json -exec gh release upload "$PACK_RELEASE" --repo "$GITHUB_REPOSITORY" {} +
          gh release upload offline-data pack-release/catalog-v2.json --repo "$GITHUB_REPOSITORY" --clobber
          # Published pack generations are never deleted: apps cache catalogs without an expiry, so any
          # catalog a device has seen must keep downloading. catalog.json and its unversioned packs stay
          # frozen for clients released before 20 MB packs.
