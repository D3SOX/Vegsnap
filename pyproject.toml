[dependency-groups]
lint = ["ruff==0.17.2"]

[tool.ruff]
# Lint only; ruff format is not used.
include = ["*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# The Xcode project generator is written as deliberately compact one-liners.
"ios/generate-project.py" = ["E701", "E702"]
