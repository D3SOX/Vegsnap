# Lint only: formatting rules stay off because the Swift sources use long lines on purpose.
included:
  - ios
disabled_rules:
  - line_length
  - statement_position
  - colon
  - comma
  # Size and complexity metrics put the current count into their message, so the baseline
  # stops matching as soon as an already-long file or function changes at all.
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
# Existing findings are recorded here; new code must be clean.
baseline: ios/.swiftlint-baseline.json
